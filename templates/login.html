{% extends 'base.html' %}

{% block title %}Sign In — AirScan Club{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to your AirScan frequent flyer account</p>
    </div>

    <!-- Quick Demo Logins for instant grading/testing -->
    <div style="background: rgba(229, 184, 105, 0.08); border: 1px dashed var(--border-gold); border-radius: var(--radius-md); padding: 0.9rem; margin-bottom: 1.5rem;">
      <div style="font-size: 0.72rem; color: var(--gold-primary); font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem;">
        <i class="fa-solid fa-bolt"></i> Quick Demo Logins
      </div>
      <div style="display: flex; gap: 0.6rem;">
        <button type="button" class="btn btn-glass" style="flex: 1; padding: 0.4rem 0.6rem; font-size: 0.78rem;"
                onclick="fillCredentials('john.doe@example.com', 'password123')">
          <i class="fa-solid fa-user"></i> Passenger Demo
        </button>
        <button type="button" class="btn btn-glass" style="flex: 1; padding: 0.4rem 0.6rem; font-size: 0.78rem;"
                onclick="fillCredentials('admin@airscan.com', 'admin123')">
          <i class="fa-solid fa-user-shield"></i> Flight Ops Admin
        </button>
      </div>
    </div>

    <form action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST">
      <div class="form-group">
        <label><i class="fa-regular fa-envelope"></i> Email Address</label>
        <input type="email" name="email" id="email" class="input-box" value="{{ email or '' }}" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-key"></i> Password</label>
        <input type="password" name="password" id="password" class="input-box" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; margin-top: 1rem;">
        Sign In to AirScan
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.8rem; font-size: 0.88rem; color: var(--text-muted);">
      Don't have an AirScan account? 
      <a href="{{ url_for('register') }}" style="font-weight: 700;">Join AirScan Club</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function fillCredentials(email, pwd) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pwd;
  showToast(`Auto-filled ${email} credentials!`, 'info');
}
</script>
{% endblock %}
